# Day of Defeat class ids as read at spawn into ktp_life_events.player_class.
#
# Ids follow KTPAMXX plugins/include/dodconst.inc (DODC_*). `role` is the
# hlstatsx killerRole code for the same class, where one exists; the mapping
# test pins every role-carrying id against measured killerRole counts.
# `side` is the side that can pick the class (British classes play as Allies).

[classes.1]
code = "garand"
name = "Rifleman"
side = "Allies"
role = "#class_allied_garand"

