# Trimmed from a grub-mkconfig output: header default logic, the 10_linux menu, the EFI firmware entry.
### BEGIN /etc/grub.d/00_header ###
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="0"
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Ubuntu' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-ROOT_FS_UUID' {
	recordfail
	load_video
	gfxmode $linux_gfx_mode
	insmod gzio
	if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
	insmod part_gpt
	insmod ext2
	set root='hd1,gpt2'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  ROOT_FS_UUID
	else
	  search --no-floppy --fs-uuid --set=root ROOT_FS_UUID
	fi
	linux	/boot/vmlinuz-6.8.0-139-generic root=UUID=ROOT_FS_UUID ro  intel_idle.max_cstate=0 mitigations=off processor.max_cstate=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
	initrd	/boot/initrd.img-6.8.0-139-generic
}
submenu 'Advanced options for Ubuntu' $menuentry_id_option 'gnulinux-advanced-ROOT_FS_UUID' {
	menuentry 'Ubuntu, with Linux 6.8.0-139-generic' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-139-generic-advanced-ROOT_FS_UUID' {
		recordfail
		load_video
		gfxmode $linux_gfx_mode
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_gpt
		insmod ext2
		set root='hd1,gpt2'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  ROOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root ROOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-139-generic ...'
		linux	/boot/vmlinuz-6.8.0-139-generic root=UUID=ROOT_FS_UUID ro  intel_idle.max_cstate=0 mitigations=off processor.max_cstate=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
		echo	'Loading initial ramdisk ...'
		initrd	/boot/initrd.img-6.8.0-139-generic
	}
	menuentry 'Ubuntu, with Linux 6.8.0-139-generic (recovery mode)' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-139-generic-recovery-ROOT_FS_UUID' {
		recordfail
		load_video
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_gpt
		insmod ext2
		set root='hd1,gpt2'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  ROOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root ROOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-139-generic ...'
		linux	/boot/vmlinuz-6.8.0-139-generic root=UUID=ROOT_FS_UUID ro recovery nomodeset dis_ucode_ldr 
		echo	'Loading initial ramdisk ...'
		initrd	/boot/initrd.img-6.8.0-139-generic
	}
	menuentry 'Ubuntu, with Linux 6.8.0-138-lowlatency' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-138-lowlatency-advanced-ROOT_FS_UUID' {
		recordfail
		load_video
		gfxmode $linux_gfx_mode
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_gpt
		insmod ext2
		set root='hd1,gpt2'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  ROOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root ROOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-138-lowlatency ...'
		linux	/boot/vmlinuz-6.8.0-138-lowlatency root=UUID=ROOT_FS_UUID ro  intel_idle.max_cstate=0 mitigations=off processor.max_cstate=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
		echo	'Loading initial ramdisk ...'
		initrd	/boot/initrd.img-6.8.0-138-lowlatency
	}
	menuentry 'Ubuntu, with Linux 6.8.0-138-lowlatency (recovery mode)' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-138-lowlatency-recovery-ROOT_FS_UUID' {
		recordfail
		load_video
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_gpt
		insmod ext2
		set root='hd1,gpt2'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd1,gpt2 --hint-efi=hd1,gpt2 --hint-baremetal=ahci1,gpt2  ROOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root ROOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-138-lowlatency ...'
		linux	/boot/vmlinuz-6.8.0-138-lowlatency root=UUID=ROOT_FS_UUID ro recovery nomodeset dis_ucode_ldr 
		echo	'Loading initial ramdisk ...'
		initrd	/boot/initrd.img-6.8.0-138-lowlatency
	}
}

### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/30_uefi-firmware ###
if [ "$grub_platform" = "efi" ]; then
	fwsetup --is-supported
	if [ "$?" = 0 ]; then
		menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
			fwsetup
		}
	fi
fi
### END /etc/grub.d/30_uefi-firmware ###
