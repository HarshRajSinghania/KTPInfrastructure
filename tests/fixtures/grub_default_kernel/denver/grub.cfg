# Trimmed from a grub-mkconfig output: header default logic, the 10_linux menu, the EFI firmware entry.
### BEGIN /etc/grub.d/00_header ###
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="0"
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Ubuntu' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-ROOT_FS_UUID' {
	recordfail
	load_video
	gfxmode $linux_gfx_mode
	insmod gzio
	if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
	insmod part_msdos
	insmod ext2
	set root='hd0,msdos1'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  BOOT_FS_UUID
	else
	  search --no-floppy --fs-uuid --set=root BOOT_FS_UUID
	fi
	linux	/vmlinuz-6.8.0-138-lowlatency root=UUID=ROOT_FS_UUID ro consoleblank=0 systemd.show_status=true intel_idle.max_cstate=0 processor.max_cstate=0 mitigations=off consoleblank=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
	initrd	/initrd.img-6.8.0-138-lowlatency
}
submenu 'Advanced options for Ubuntu' $menuentry_id_option 'gnulinux-advanced-ROOT_FS_UUID' {
	menuentry 'Ubuntu, with Linux 6.8.0-138-lowlatency' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-138-lowlatency-advanced-ROOT_FS_UUID' {
		recordfail
		load_video
		gfxmode $linux_gfx_mode
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_msdos
		insmod ext2
		set root='hd0,msdos1'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  BOOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root BOOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-138-lowlatency ...'
		linux	/vmlinuz-6.8.0-138-lowlatency root=UUID=ROOT_FS_UUID ro consoleblank=0 systemd.show_status=true intel_idle.max_cstate=0 processor.max_cstate=0 mitigations=off consoleblank=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
		echo	'Loading initial ramdisk ...'
		initrd	/initrd.img-6.8.0-138-lowlatency
	}
	menuentry 'Ubuntu, with Linux 6.8.0-138-lowlatency (recovery mode)' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-138-lowlatency-recovery-ROOT_FS_UUID' {
		recordfail
		load_video
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_msdos
		insmod ext2
		set root='hd0,msdos1'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  BOOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root BOOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-138-lowlatency ...'
		linux	/vmlinuz-6.8.0-138-lowlatency root=UUID=ROOT_FS_UUID ro single nomodeset dis_ucode_ldr consoleblank=0 systemd.show_status=true
		echo	'Loading initial ramdisk ...'
		initrd	/initrd.img-6.8.0-138-lowlatency
	}
	menuentry 'Ubuntu, with Linux 6.8.0-110-lowlatency' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-110-lowlatency-advanced-ROOT_FS_UUID' {
		recordfail
		load_video
		gfxmode $linux_gfx_mode
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_msdos
		insmod ext2
		set root='hd0,msdos1'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  BOOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root BOOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-110-lowlatency ...'
		linux	/vmlinuz-6.8.0-110-lowlatency root=UUID=ROOT_FS_UUID ro consoleblank=0 systemd.show_status=true intel_idle.max_cstate=0 processor.max_cstate=0 mitigations=off consoleblank=0 isolcpus=2,3,4,5,6,7 nohz_full=2,3,4,5,6,7 rcu_nocbs=2,3,4,5,6,7
		echo	'Loading initial ramdisk ...'
		initrd	/initrd.img-6.8.0-110-lowlatency
	}
	menuentry 'Ubuntu, with Linux 6.8.0-110-lowlatency (recovery mode)' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.8.0-110-lowlatency-recovery-ROOT_FS_UUID' {
		recordfail
		load_video
		insmod gzio
		if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
		insmod part_msdos
		insmod ext2
		set root='hd0,msdos1'
		if [ x$feature_platform_search_hint = xy ]; then
		  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  BOOT_FS_UUID
		else
		  search --no-floppy --fs-uuid --set=root BOOT_FS_UUID
		fi
		echo	'Loading Linux 6.8.0-110-lowlatency ...'
		linux	/vmlinuz-6.8.0-110-lowlatency root=UUID=ROOT_FS_UUID ro single nomodeset dis_ucode_ldr consoleblank=0 systemd.show_status=true
		echo	'Loading initial ramdisk ...'
		initrd	/initrd.img-6.8.0-110-lowlatency
	}
}

### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/30_uefi-firmware ###
if [ "$grub_platform" = "efi" ]; then
	fwsetup --is-supported
	if [ "$?" = 0 ]; then
		menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
			fwsetup
		}
	fi
fi
### END /etc/grub.d/30_uefi-firmware ###
