[Unit]
# Posts a red Discord embed via /usr/local/bin/ktp-systemd-alert on failure.
# Companion to ktp-data-server-health.sh, the periodic safety net.
# Verify with `systemctl show -p OnFailure`, never a grep of the unit file --
# ktp-stats-export.service claimed this wiring in a comment while the directive
# was absent, and its failures reached nobody.
OnFailure=ktp-systemd-alert@%n.service
